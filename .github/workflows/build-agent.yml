name: Build agente_impressora.exe

on:
  push:
    tags:
      - 'agente-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da versão (ex: agente-v1.2)'
        required: true
        default: 'agente-v1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pyinstaller pyserial pywin32

      - name: Build .exe
        run: >
          pyinstaller
          --onefile
          --noconsole
          --name agent_impressora
          --hidden-import win32print
          --hidden-import win32api
          --hidden-import serial
          --hidden-import serial.tools.list_ports
          agente_impressora.py

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Agente de Impressão ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body: |
            ## Agente de Impressão — Golden Sky 80mm

            Compatível com Golden Sky 80mm **WiFi**, **Rede** e **USB**.

            ### Como instalar
            1. Baixe o `agent_impressora.exe` abaixo
            2. Execute no computador do caixa — fica em segundo plano na porta 9100
            3. Verifique em http://localhost:9100/status se o agente está rodando

            ### Modos (edite o `.py` antes de gerar o `.exe` se precisar mudar)
            | Modo | Quando usar |
            |------|-------------|
            | `usb` | Impressora USB com driver instalado no Windows *(padrão)* |
            | `wifi` | Impressora na rede WiFi ou cabo Ethernet |
            | `serial` | USB com chip serial (CH340, CP210x, etc.) |
          files: dist/agent_impressora.exe
          draft: false
          prerelease: false
